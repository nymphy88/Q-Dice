
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantum Gamble</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #050505;
        font-family: 'Rajdhani', sans-serif;
        color: #e0e0e0;
        overflow-x: hidden;
      }
      .font-orbitron {
        font-family: 'Orbitron', sans-serif;
      }
      .neon-border-cyan {
        box-shadow: 0 0 5px #00ffff, 0 0 20px #00ffff22;
      }
      .neon-border-pink {
        box-shadow: 0 0 5px #ff00ff, 0 0 20px #ff00ff22;
      }
      .neon-text-cyan {
        text-shadow: 0 0 8px #00ffff, 0 0 15px #00ffff55;
      }
      .neon-text-pink {
        text-shadow: 0 0 8px #ff00ff, 0 0 15px #ff00ff55;
      }
      .glow-box-cyan {
        box-shadow: inset 0 0 15px #00ffff33, 0 0 15px #00ffff33;
      }
      .glow-box-pink {
        box-shadow: inset 0 0 15px #ff00ff33, 0 0 15px #ff00ff33;
      }
      
      @keyframes glitch {
        0% { transform: translate(0); }
        20% { transform: translate(-2px, 2px); }
        40% { transform: translate(-2px, -2px); }
        60% { transform: translate(2px, 2px); }
        80% { transform: translate(2px, -2px); }
        100% { transform: translate(0); }
      }
      .glitch-hover:hover {
        animation: glitch 0.3s infinite linear;
      }
      
      .scanline {
        width: 100%;
        height: 100px;
        z-index: 5;
        background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(255, 255, 255, 0.05) 50%, rgba(0, 0, 0, 0) 100%);
        opacity: 0.1;
        position: fixed;
        bottom: 100%;
        animation: scanline 6s linear infinite;
        pointer-events: none;
      }

      @keyframes scanline {
        0% { bottom: 100%; }
        100% { bottom: -100px; }
      }

      @keyframes neon-pulse {
        0%, 100% { opacity: 1; filter: brightness(1); }
        50% { opacity: 0.8; filter: brightness(1.2); }
      }
      .animate-neon-pulse {
        animation: neon-pulse 2s infinite ease-in-out;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
  <body>
    <div class="scanline"></div>
    <div id="root"></div>
  </body>
</html>
